name: Renovate automerge

# Merges, once every check is green, Renovate PRs in the automerge tier that only bump patch
# versions. The merge is done with the algoan-merger GitHub App, a bypass actor of the branch
# ruleset, with a merge commit like the other PRs of this repository. A merge publishes nothing: the
# fixed packages reach npm at the next manual run of "Test and Publish Workflow" (lerna version +
# publish from master).

on:
  workflow_run:
    # Renovate triage also starts it with workflow_dispatch once a PR is in the automerge tier.
    workflows: ["Test and Publish Workflow"]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Renovate PR to merge"
        required: true
        type: string
      attempt:
        description: "New runs already started because checks were still running"
        required: false
        type: number
        default: 0

permissions:
  # Starts a new run of itself when checks outlast the wait.
  actions: write
  contents: read
  pull-requests: read
  checks: read

# Keyed by PR, so the run the triage starts and the one the test workflow starts take turns instead
# of both trying to merge.
concurrency:
  group: renovate-automerge-${{ inputs.pr_number || github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  automerge:
    name: Merge green Renovate security PR
    # Public repository: a fork can name its branch renovate/*, so only runs of this repository count.
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event.workflow_run.conclusion == 'success'
        && github.event.workflow_run.event == 'pull_request'
        && github.event.workflow_run.head_repository.full_name == github.repository
        && startsWith(github.event.workflow_run.head_branch, 'renovate/'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # The merge needs every check done, but the end of Socket or CodeRabbit starts no new run when
      # it comes after the test workflow: wait for them here, 8 minutes at most, then start a new run
      # of this workflow (three times at most) rather than give up.
      - name: Wait for the running checks
        id: wait
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number || github.event.workflow_run.pull_requests[0].number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          ATTEMPT: ${{ inputs.attempt || 0 }}
        run: |
          # The head commit of the CI run, else the one of the PR given to workflow_dispatch.
          sha="$HEAD_SHA"
          if [[ -z "$sha" ]]; then
            if [[ ! "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
              echo "::error::pr_number must be a number"
              echo "ready=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sha=$(gh pr view "$PR_NUMBER" -R "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)
          fi
          for check in $(seq 1 16); do
            running=$(gh api "repos/$GITHUB_REPOSITORY/commits/$sha/check-runs?per_page=100" \
              --jq '[.check_runs[] | select(.status != "completed")] | length')
            if [[ "$running" == "0" ]]; then
              echo "ready=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "$running check(s) still running ($check/16)"
            sleep 30
          done
          echo "ready=false" >> "$GITHUB_OUTPUT"
          if [[ "$PR_NUMBER" =~ ^[0-9]+$ ]] && (( ATTEMPT < 3 )); then
            gh workflow run renovate-automerge.yml -R "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" \
              -f pr_number="$PR_NUMBER" -f attempt="$((ATTEMPT + 1))"
            echo "Checks still running after 8 minutes: started a new run ($((ATTEMPT + 1))/3)"
          else
            echo "::warning::Checks still running after 8 minutes, no new run started: run this workflow with the PR number once they end"
          fi

      # A public repository can't call the actions of the private algoan/private-actions with
      # `uses:`: check them out with a token that can read it. Pinned by commit, with its tag in the
      # comment for Renovate (customManagers of renovate.json).
      - name: Checkout private actions
        if: steps.wait.outputs.ready == 'true'
        uses: actions/checkout@v7
        with:
          repository: algoan/private-actions
          ref: e104079e17d81b3e0e5ac94b4984ac2906139da8 # v2.4.0
          path: .github/private-actions
          token: ${{ secrets.REPO_GHA_PAT }}
          persist-credentials: false

      - name: Merge
        if: steps.wait.outputs.ready == 'true'
        uses: ./.github/private-actions/renovate-automerge
        with:
          app_id: ${{ secrets.ALGOAN_MERGER_APP_ID }}
          private_key: ${{ secrets.ALGOAN_MERGER_PRIVATE_KEY }}
          pr_number: ${{ inputs.pr_number }}
          # Must be present and green: "Tests", which sums up the Node.js matrix of
          # test-and-publish.yaml, and Socket, which scans the dependencies the PR brings. Any other
          # red check blocks the merge too.
          required_checks: "${{ vars.AUTOMERGE_REQUIRED_CHECKS || 'Tests,Socket Security: Pull Request Alerts' }}"
          # A merge commit, like the other PRs here: lerna version reads the conventional commits of master.
          merge_method: merge
          hotfix_enabled: "false"
          cvss_hotfix_threshold: ${{ vars.CVSS_HOTFIX_THRESHOLD || '9.0' }}
          cvss_automerge_threshold: ${{ vars.CVSS_AUTOMERGE_THRESHOLD || '4.0' }}
          ecosystems: npm
