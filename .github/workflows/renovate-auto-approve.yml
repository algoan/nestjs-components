name: Renovate auto-approve

# Approves every commit Renovate pushes, as github-actions. That approval counts as one of the two
# the master ruleset requires, so a Renovate PR only needs ONE human review.
#
# pull_request_target: the workflow always comes from the base branch, so a Renovate PR cannot
# change what runs with REPO_GHA_PAT. Nothing from the PR is checked out.

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  auto-approve:
    name: Auto-approve Renovate dependency PRs
    # Only approve pushes made by Renovate itself; never from a rerun, whose head may have moved.
    if: >-
      github.actor == 'renovate[bot]'
      && github.run_attempt == 1
      && github.event.pull_request.user.login == 'renovate[bot]'
      && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - name: Checkout private actions
        uses: actions/checkout@v7
        with:
          repository: algoan/private-actions
          ref: 24d09ca03fa69115d50721d7a1ef123bc905f42b # v2.3.0
          path: .github/private-actions
          token: ${{ secrets.REPO_GHA_PAT }}
          persist-credentials: false

      - name: Approve the pushed commit
        uses: ./.github/private-actions/renovate-auto-approve
